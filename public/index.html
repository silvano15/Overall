<!DOCTYPE html>
<html lang="pt-BR" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050907">
<title>Overall — Pelada</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/fx.css">
</head>
<body>

<!-- fundo: aurora desfocada (figura-fundo) -->
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<!-- LOGIN -->
<div id="login-screen">
  <form class="card login-card" onsubmit="event.preventDefault(); doLogin();">
    <div class="login-logo">
      <div id="login-mark" class="login-mark"></div>
      <div class="word grad-text">OVERALL</div>
      <div class="eyebrow" style="margin-top:10px">Pelada de fim de semana</div>
    </div>
    <label class="field"><span>Usuário</span>
      <input type="text" id="login-username" autocomplete="username" autocapitalize="none" placeholder="admin"></label>
    <label class="field"><span>Senha</span>
      <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••"></label>
    <button class="btn primary block lg" type="submit">Entrar</button>
    <div class="login-error" id="login-error" hidden></div>
  </form>
</div>

<!-- APP -->
<div id="app" hidden>
  <header class="topbar">
    <div class="logo"><span id="topbar-logo"></span>OVERALL</div>
    <div class="topbar-title" id="topbar-title"></div>
  </header>

  <main id="view"></main>

  <nav class="nav" id="nav" aria-label="Navegação principal">
    <span class="nav-pill" aria-hidden="true"></span>
    <a href="#/grupos" data-tab="pelada" data-ic="pitch"><span>Pelada</span></a>
    <a href="#/grupos" data-tab="jogadores" data-ic="users"><span>Jogadores</span></a>
    <a href="#/grupos" data-tab="rankings" data-ic="trophy"><span>Rankings</span></a>
    <a href="#/conta" data-tab="conta" data-ic="user"><span>Conta</span></a>
  </nav>
</div>

<!-- Gaveta reutilizada por todos os modais -->
<div id="sheet-overlay" hidden>
  <div id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <div class="sheet-header">
      <div class="sheet-title" id="sheet-title"></div>
      <button class="btn icon sm ghost" onclick="fecharSheet()" aria-label="Fechar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div id="toast" hidden></div>

<!-- Core Scripts essenciais (carregamento instantâneo) -->
<script src="js/api.js"></script>
<script src="js/icons.js"></script>
<script src="js/ui.js"></script>
<script src="js/grupos.js"></script>
<script src="js/app.js"></script>
</body>
</html>
