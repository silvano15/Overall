services:
  mysql:
    image: mysql:8.0
    container_name: overall-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: overall
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - overall-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

# Para usar este MySQL, defina MYSQL_ROOT_PASSWORD e DB_PASS com o mesmo valor.
# Em produção, use um usuário de aplicação sem privilégios de root.
volumes:
  overall-mysql-data:
