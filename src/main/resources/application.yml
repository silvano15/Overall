# =================================================================
#  Configurações principais do Overall (app de pelada)
#  ----------------------------------------------------------------
#  Valores sensíveis (senha, segredo JWT) saem por variáveis de
#  ambiente em produção. Em desenvolvimento, usamos defaults locais
#  com a sintaxe ${VAR:default}.
# =================================================================

server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: overall

  datasource:
    # createDatabaseIfNotExist: o banco 'overall' é criado sozinho na primeira execução.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:overall}?sslMode=${DB_SSL_MODE:REQUIRED}&serverTimezone=America/Recife&allowPublicKeyRetrieval=false&createDatabaseIfNotExist=true
    username: ${DB_USER:root}
    password: ${DB_PASS:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 'none' = o Hibernate nunca mexe no banco; quem manda no schema é o Flyway.
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    show-sql: false   # Vire true se quiser ver os SQLs no console durante o estudo.
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Fotos dos jogadores chegam como JSON (miniatura em base64), então o corpo é pequeno.
  servlet:
    multipart:
      enabled: false

overall:
  # Fuso usado para decidir "hoje" (liberação do sorteio) e para o cronômetro.
  timezone: ${APP_TIMEZONE:America/Recife}
  jwt:
    # IMPORTANTE: em produção, o 'secret' DEVE vir de variável de ambiente (JWT_SECRET).
    # O valor abaixo do ":" é só um default de DESENVOLVIMENTO local, para não depender
    # de configurar variável de ambiente do Windows/VS Code. NUNCA use esse default em produção.
    # A chave precisa ter no mínimo 256 bits (32 caracteres) para HS256.
    secret: ${JWT_SECRET:dev-apenas-local-troque-em-producao-yz8eBFZTTbtzONEz7t2TWRvu0sL77CBBm2K0Zi0}
    # O ADM usa pelo celular: 30 dias evita pedir senha toda semana.
    expiration-hours: ${JWT_EXPIRATION_HOURS:720}
  security:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}

# Swagger UI fica em:  http://localhost:8080/api/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    br.com.overall: DEBUG
    org.springframework.security: INFO
