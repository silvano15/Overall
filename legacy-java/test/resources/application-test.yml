# Testes de integração: H2 em memória no modo MySQL, rodando as MESMAS migrations do Flyway.
spring:
  datasource:
    url: jdbc:h2:mem:pelada;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-test

logging:
  level:
    br.com.overall: INFO
overall:
  jwt:
    secret: teste-segredo-jwt-com-mais-de-32-caracteres
    expiration-hours: 1
